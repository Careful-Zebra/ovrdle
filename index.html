<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FIFA Wordle</title>
  <meta name="description" content="Guess the FIFA ratings of five footballers. A new challenge every day." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-help" aria-label="How to play" title="How to play">?</button>
    <div class="brand">
      <h1>FIFA<span>WORDLE</span></h1>
    </div>
    <button class="icon-btn" id="btn-stats" aria-label="Statistics" title="Statistics">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3"  y="12" width="4" height="9" rx="1" fill="currentColor"/>
        <rect x="10" y="6"  width="4" height="15" rx="1" fill="currentColor"/>
        <rect x="17" y="9"  width="4" height="12" rx="1" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <main class="main">
    <p class="meta" id="meta"></p>
    <ol class="board" id="board" aria-label="Today's five players"></ol>
  </main>

  <div class="keypad" id="keypad" aria-label="Rating keypad"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-scrim" id="modal-scrim" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">&#215;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
